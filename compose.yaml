services:
  auditor:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "10.0.0.118:3050:3050"
    environment:
      DB_HOST: "${DB_HOST:-10.0.0.115}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER:-world_auditor}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in Portainer stack environment variables}"
      DB_NAME: "${DB_NAME:-world}"
    volumes:
      - ./update-requests:/update-requests
