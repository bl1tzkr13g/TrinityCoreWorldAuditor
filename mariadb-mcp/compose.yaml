services:
  mariadb-mcp:
    build:
      context: ./mariadb-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      DB_HOST: "${DB_HOST:-10.0.0.115}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER:-world_auditor}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in Portainer stack variables}"
      DB_NAME: "${DB_NAME:-world}"
      MCP_READ_ONLY: "true"
      MCP_BLOCK_SENSITIVE_SHOW: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
